name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Extract Version Info
        id: version_step
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d '+' -f 1)
          BUILD=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d '+' -f 2)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD=${BUILD}" >> $GITHUB_ENV
          echo "Version: ${VERSION} (Build ${BUILD})"

      - name: Configure Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.versionCode=${{ env.BUILD }}" >> android/local.properties
          echo "flutter.versionName=${{ env.VERSION }}" >> android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons from Logo
        run: |
          python3 -m pip install --upgrade pillow
          python3 -c "
          from PIL import Image
          import os
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          logo_path = 'assets/logo.webp' if os.path.exists('assets/logo.webp') else 'assets/logo.jpg'
          img = Image.open(logo_path).convert('RGBA')
          for folder, size in sizes.items():
              d = os.path.join('android/app/src/main/res', folder)
              os.makedirs(d, exist_ok=True)
              img.resize((size, size), Image.Resampling.LANCZOS).save(os.path.join(d, 'ic_launcher.png'), 'PNG')
          print('Successfully generated launcher icons for all mipmap densities!')
          "

      - name: Build Release APKs (Split per ABI with Obfuscation & R8 Minification)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./build/app/outputs/symbols --android-skip-build-dependency-validation

      - name: Prepare Named APK Artifacts
        run: |
          mkdir -p release_apks
          # Main arm64-v8a APK (~16MB, 98%+ modern Android phones)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/smartsomiti-v${{ env.VERSION }}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/smartsomiti-latest.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/smartsomiti-v${{ env.VERSION }}-arm64.apk
          # 32-bit armeabi-v7a APK (~14MB, older Android phones)
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_apks/smartsomiti-v${{ env.VERSION }}-arm32.apk
          ls -lh release_apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartsomiti-apk-v${{ env.VERSION }}
          path: release_apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ env.VERSION }}
          name: "স্মার্ট সমিতি রিলিজ v${{ env.VERSION }} (Build ${{ env.BUILD }})"
          body: |
            ### 📱 স্মার্ট সমিতি - আল্ট্রা-লাইটওয়েট ডিপ-অপ্টিমাইজড রিলিজ (~৮-১০ MB)
            - **সংস্করণ**: `v${{ env.VERSION }}` (Build: `${{ env.BUILD }}`)
            - **ইন-প্লেস আপডেট সমর্থিত**: হ্যাঁ (আগের অ্যাপ আনইনস্টল করতে হবে না)
            - **প্রধান ডাউনলোড (স্মার্টফোন 64-bit, ~৮-১০ MB)**: [smartsomiti-v${{ env.VERSION }}.apk](https://github.com/sajjadhossan/smartsomiti/releases/download/v${{ env.VERSION }}/smartsomiti-v${{ env.VERSION }}.apk)
            - **সর্বশেষ সংস্করণ লিংক**: [smartsomiti-latest.apk](https://github.com/sajjadhossan/smartsomiti/releases/download/v${{ env.VERSION }}/smartsomiti-latest.apk)
            - **পুরাতন ফোন (32-bit, ~৭-৮ MB)**: [smartsomiti-v${{ env.VERSION }}-arm32.apk](https://github.com/sajjadhossan/smartsomiti/releases/download/v${{ env.VERSION }}/smartsomiti-v${{ env.VERSION }}-arm32.apk)
            - **ওয়েব অ্যাপ**: https://smartsomiti.vercel.app
          files: |
            release_apks/smartsomiti-v${{ env.VERSION }}.apk
            release_apks/smartsomiti-latest.apk
            release_apks/smartsomiti-v${{ env.VERSION }}-arm64.apk
            release_apks/smartsomiti-v${{ env.VERSION }}-arm32.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
