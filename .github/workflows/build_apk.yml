name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Version Info
        id: version_step
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d '+' -f 1)
          BUILD=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d '+' -f 2)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD=${BUILD}" >> $GITHUB_ENV
          echo "Version: ${VERSION} (Build ${BUILD})"

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Named APK Artifacts
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/smartsomiti-v${{ env.VERSION }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/smartsomiti-latest.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartsomiti-apk-v${{ env.VERSION }}
          path: release_apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ env.VERSION }}
          name: "স্মার্ট সমিতি রিলিজ v${{ env.VERSION }} (Build ${{ env.BUILD }})"
          body: |
            ### 📱 স্মার্ট সমিতি - অ্যান্ড্রয়েড অ্যাপ রিলিজ
            - **সংস্করণ**: `v${{ env.VERSION }}` (Build: `${{ env.BUILD }}`)
            - **ইন-প্লেস আপডেট সমর্থিত**: হ্যাঁ (বিদ্যমান অ্যাপ আনইনস্টল করা লাগবে না, সরাসরি আপডেট হবে)
            - **ফাইল**: `smartsomiti-v${{ env.VERSION }}.apk`
            - **ওয়েব অ্যাপ**: https://smartsomiti.vercel.app
          files: |
            release_apks/smartsomiti-v${{ env.VERSION }}.apk
            release_apks/smartsomiti-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
