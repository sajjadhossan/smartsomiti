name: cloud_sync_drive
description: "Cross-device real-time sync with Google Sign-in and Google Drive backup"
publish_to: "none"
version: 2.8.2+36

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  intl: ^0.19.0
  permission_handler: ^11.3.1
  webview_flutter_android: ^4.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/index.html
    - assets/logo.jpg
    - assets/smart_somiti_logo.jpg
    - assets/swapno_chowa_logo.jpg
    - assets/pad_header.jpg
    - version.json
